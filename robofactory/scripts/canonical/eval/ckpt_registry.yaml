# =============================================================================
# CHECKPOINT REGISTRY — single source of truth for canonical Pi0.5 checkpoints.
# Week-2 lane L3 (decision-table row #8).
#
# WHY THIS EXISTS
#   One openpi `config_name` (e.g. `pi05_robofactory_lb_ws_cent`) resolves to
#   MULTIPLE training-run subdirs on disk. An eval that picks "the" checkpoint
#   by config_name silently grabs whichever run a launcher happened to point at.
#   That is exactly how the bogus "LB ws 100% -> 20%" reading happened: E10
#   resolved `lb_ws_cent` to the WORSE of two training runs (the 05-16-fp run,
#   step 19999) and reported it as a regression.
#
#   This file pins, per config_name, the ONE training-run dir + step that is
#   blessed as canonical, plus its wandb_id / git_sha / norm_stats_md5. The
#   drift guard (`robofactory/utils/ckpt_registry.py` + the eval hook) hard-fails
#   if an eval resolves a DIFFERENT dir/step than what is pinned here.
#
# SCOPE (deliberate): LiftBarrier (LB) + ThreeRobotsStackCube (TSC) ONLY.
#   PM / 2SC / LP are intentionally NOT pinned here (out of scope for L3).
#   A config_name absent from this registry is "unregistered" -> the guard
#   treats it as un-pinned and (by default) WARNS rather than hard-fails, so
#   evals of unpinned tasks are not blocked.
#
# IDENTITY NOTE
#   `norm_stats_md5` does NOT discriminate sibling runs of the same task: it is
#   a function of the training DATA, so ws/wc arms of one task share an md5, and
#   the two `lb_ws_cent` runs share an md5 too. The DISCRIMINATING identity is
#   `ckpt_dir` + `step`. The guard's primary keys are dir+step; md5 is recorded
#   as a secondary cross-check only.
#
# `git_sha: null` for most rows is EXPECTED, not missing data: openpi did not
#   write `openpi_git_sha` into `ckpt_format.json` for these runs (the field is
#   literally `null` on disk). Recorded as null rather than guessed.
#
# Trust tags mirror /iris/u/mikulrai/notes/NUMBER_TRUST_LEDGER.md.
#   CITE       = canonical, reproducible, safe to pin + cite.
#   AMBIGUOUS  = multiple real runs under this config; the canonical one is NOT
#                established by the audit -> pinned to a best-guess + flagged.
#   UNVERIFIED = canonical ckpt is irreproducible / unknown -> DO NOT auto-eval;
#                guard set to hard-fail so nobody silently re-runs the wrong one.
#   MISSING    = config_name has NO resolvable full checkpoint on disk.
#
# Built 2026-06-22 (Week-2 L3). Roots scanned:
#   /iris/u/mikulrai/checkpoints/openpi/
# =============================================================================

