      error: /iris/u/mikulrai/logs/eval_2026-05-11/eval_dp_2sc_%x_%j.err

  # ---------------------------------------------------------------------------
  # dp_decent_multi — LongPipelineDelivery (LP) 1-demo overfit eval.
  #
  # Migrated from eval_dp_lp_overfit.sh. 4-arm task; evaluates the maxfit
  # overfit ckpt at the training seed (=14) with 3 stochastic-DDPM retries.
  #
  # Correctness invariants (do NOT tidy):
  #   - seeds = "14 14 14" (3 repeats of the training seed). A dedicated seed
  #     file /iris/u/mikulrai/runs/eval_seeds_lp_overfit_s14x3.txt holds exactly
  #     these 3 lines so the dispatcher's seed-hash + argv-drift preflight passes
  #     (the legacy script had NO preflight — this is a stricter add, harmless).
  #   - checkpoint_num=200 (legacy default), max_steps=900, suffix=workspace_overfit1_maxfit
  #   - 4 arms all panda_wristcam_multi, include_global, 224x224, -b gpu
  #   - wandb project=LP-DP + fixed --wandb-name via extra_argv.
  # NOTE: the legacy script is CAM_FAMILY/CKPT_SUFFIX/CHECKPOINT_NUM/SEED/N_RETRIES
  # parameterized; this launcher fixes the documented DEFAULTS (workspace, 200,
  # seed 14, 3 retries). The `--skip-collapse-probe` knob (SKIP_PROBE) defaults
  # off in the legacy, so it is not emitted here.
  # ---------------------------------------------------------------------------
  lp_dp_overfit1_maxfit:
    policy_type: dp_decent_multi
    ckpt:
      data_num: 150
      checkpoint_num: 200
      suffix: workspace_overfit1_maxfit
    task:
      env_id: LongPipelineDelivery-rf
      scene_config: configs/table/long_pipeline_delivery.yaml
