  # ---------------------------------------------------------------------------
  # dp_decent_multi — 2SC (TwoRobotsStackCube) decentralised DP, eval_multi_dp.py
  #
  # Migrated from eval_dp_2sc_decent_60seeds.sh, which was CAM_FAMILY-parameterized
  # (workspace|wristcam). Each cam-family resolves to a distinct command, so each
  # gets its own launcher; the `eval_dp_2sc_decent_60seeds.sh` wrapper picks the
  # launcher_id from $CAM_FAMILY (default: wristcam, matching the legacy primary).
  #
  # Correctness invariants preserved from the legacy script (do NOT tidy):
  #   - seed set = eval_seeds_60_dp.txt (the 10000-10029 + 1000-1029 x-bucket set;
  #     legacy default DEFAULT_SEEDS_LIST is exactly this set, ':'-delimited)
  #   - max_steps=250 (legacy default, NOT 400)
  #   - dp_backend=gpu (legacy SIM_BACKEND default), include_global=true, 224x224
  #   - wandb project=2SC-DP and a fixed --wandb-name carried via extra_argv
  #     (the DP argv builders do not emit --wandb-project/--wandb-name).
  # ---------------------------------------------------------------------------
  2sc_dp_decent_wristcam:
    policy_type: dp_decent_multi
    ckpt:
      data_num: 150
      checkpoint_num: 300
      suffix: wristcam_decent
    task:
      env_id: TwoRobotsStackCube-rf
      scene_config: configs/table/two_robots_stack_cube.yaml
      camera_family: wristcam
      num_arms: 2
      obs_cam_family: wristcam
      include_global: true
      img_height: 224
      img_width: 224
      max_steps: 250
      dp_backend: gpu
      robot_uids_csv: panda_wristcam_multi,panda_wristcam_multi
    seeds:
      file: /iris/u/mikulrai/runs/eval_seeds_60_dp.txt
      sha256_file: /iris/u/mikulrai/runs/eval_seeds_60_dp.sha256
      delim: " "
    extra_argv:
      - "--wandb-project=2SC-DP"
      - "--wandb-name=Eval 2SC WC DP Decent "
    wandb:
      project: 2SC-DP
      tags: [eval, 2sc, decent, wristcam, encoder-in1k, wristcam_decent, seedfix-v1, max250, sim-gpu, with_global_true]
    sbatch:
      job_name: eval_dp_2sc_decent
      time: "05:00:00"
      gres: "gpu:1"
      cpus_per_task: 8
      mem: "64G"
      partition: iris
      output: /iris/u/mikulrai/logs/eval_2026-05-11/eval_dp_2sc_%x_%j.out
      error: /iris/u/mikulrai/logs/eval_2026-05-11/eval_dp_2sc_%x_%j.err

  2sc_dp_decent_workspace:
    policy_type: dp_decent_multi
    ckpt:
      data_num: 150
      checkpoint_num: 300
      suffix: workspace_decent
    task:
      env_id: TwoRobotsStackCube-rf
      scene_config: configs/table/two_robots_stack_cube.yaml
