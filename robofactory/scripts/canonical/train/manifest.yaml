# =============================================================================
# DP-train-launcher manifest. One entry per (zarr × task × encoder × training)
# launcher. DP-ONLY (Pi0.5 training lives in openpi).
#
# Grouped by family for diff-readability:
#   pm_*   PickMeat single-arm encoder ablations (robot_dp)
#   tsc_d2_*  ThreeRobotsStackCube d2 wristcam decentralised per-arm (robot_dp)
#   resume_tsc_d2_*  explicit-load resumes of the above from epoch 285
#
# Run `python -m robofactory.scripts.canonical.train.manifest_schema
# scripts/canonical/train/manifest.yaml` to validate the schema.
#
# NOTE on exp_name / logging.* in extra_overrides: train.py reads these for
# wandb. They are static (no $(date)/uuid), so they live verbatim in
# extra_overrides and are reproduced exactly. The parity harness masks them.
# =============================================================================

launchers:

  # ---------------------------------------------------------------------------
  # pm — PickMeat single-arm encoder ablations (canonical retrain_dp_pm_d1_ep300_*)
  # zarr stem = PickMeat-rf_150 (shared dir); crop variant uses its own alias.
  # ---------------------------------------------------------------------------
  pm_d1_ep300_in1k:
    agent_mode: robot
    arm_id: 0
    task: {task_config: default_task, env_name: PickMeat-rf, num_arms: 1, cam_family: workspace}
    encoder: {family: resnet18_in1k}
    training: {num_epochs: 300, max_train_episodes: 150, rollout_every: 10000, seed: 100, batch_size: 64}
    resume: {auto: false}
    zarr_path: /iris/u/mikulrai/projects/RoboFactory/robofactory/data/zarr_data/PickMeat-rf_150.zarr
    ckpt_alias: PickMeat-rf_150_in1k
    preflight:
      cheap: {enabled: true, task_config: default_task, scene_config: configs/table/pick_meat.yaml, agent_id: 0}
      heavy: {gated: true, needs_overfit: true, scene_config: configs/table/pick_meat.yaml}
    wandb: {project: diffusion-robofactory, group: dp_d1_encoder_fix, tags: [robot_dp, default_task, pm-d1-ep300-in1k, encoder-fix, imagenet-pretrained]}
    extra_overrides:
      - exp_name=pm-d1-ep300-in1k
      - logging.mode=online
      - logging.project=diffusion-robofactory
      - logging.group=dp_d1_encoder_fix
      - logging.tags=[robot_dp,default_task,pm-d1-ep300-in1k,encoder-fix,imagenet-pretrained]
    sbatch:
      job_name: pm_retrain_in1k
      partition: iris-hi
      account: iris
      time: "24:00:00"
      gres: "gpu:a40:1"
      mem: "96G"
      output: /iris/u/mikulrai/logs/phase2_debug/pm_retrain_in1k_%j.out
      error: /iris/u/mikulrai/logs/phase2_debug/pm_retrain_in1k_%j.err

